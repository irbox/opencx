name: Android Build Verification

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 21 (Latest Actions v5)
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle (Latest Actions v4)
      uses: gradle/actions/setup-gradle@v4

    - name: Run Build Test
      run: chmod +x gradlew && ./gradlew assembleDebug --stacktrace
